# Integración continua: lo mismo que `npm run check` en local (formato, lint, tipos, todas las pruebas
# con umbrales de cobertura, build y presupuesto de bundle), más la auditoría de dependencias de
# producción, el índice de decisiones y la e2e. Ningún paso se salta en CI; si algo es lento aquí, es
# lento también en local. El trabajo `check` agrega `verificar` y los fragmentos de `e2e` (práctica de EchoTwin): es
# el único que exige la protección de `main`, así que renombrar o añadir un trabajo no la deja sin efecto.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: formato · lint · tipos · pruebas · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
        id: format
      - name: Mostrar las diferencias si falla el formato
        if: failure() && steps.format.outcome == 'failure'
        run: |
          npm run format > /dev/null
          git diff --exit-code
      - run: npm run lint
      - run: npm run typecheck
      - name: Pruebas (todos los niveles) con umbrales de cobertura
        run: npm run test:coverage
      - run: npm run build
      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev --audit-level=high
      - name: Índice de decisiones al día
        run: npx tsx tools/docs/decisions-index.ts --check

  # En paralelo con `verificar`, con un trabajador por trabajo para no competir con SwiftShader.
  # Historia: de cinco a nueve fragmentos (decisiones 20, 30 y 33) porque Playwright reparte por cuenta y en orden, y cada
  # prueba nueva movía las ventanas del banco de fidelidad (4–6 min cada una) hasta juntar tres en un fragmento de 15 min
  # (CI87, CI99, #45, #49). Desde el 03-10-2026 cada ventana del banco tiene su propio trabajo, elegido por nombre
  # (`grep`), y el resto se reparte en fragmentos sin ellas (`grep-invert`): añadir una prueba ya no junta las ventanas.
  # Nueve fragmentos desde el hígado y el bazo (decisión 37): cada prueba se hizo ≈ 20 % más lenta en SwiftShader y el 4.º de
  # siete sumaba 15 min (2,9 + 3,8 + 3,1 + 3,1 y el modo M). `check` sigue exigiendo toda la matriz.
  e2e:
    name: extremo a extremo (Chromium + SwiftShader) ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: 'banco blueUpper', grep: 'banco de fidelidad en blueUpper' }
          - { label: 'banco blueLower', grep: 'banco de fidelidad en blueLower' }
          - { label: 'banco plaps', grep: 'banco de fidelidad en plaps' }
          - { label: '1/9', shard: '1/9' }
          - { label: '2/9', shard: '2/9' }
          - { label: '3/9', shard: '3/9' }
          - { label: '4/9', shard: '4/9' }
          - { label: '5/9', shard: '5/9' }
          - { label: '6/9', shard: '6/9' }
          - { label: '7/9', shard: '7/9' }
          - { label: '8/9', shard: '8/9' }
          - { label: '9/9', shard: '9/9' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Versión de Playwright (clave de la caché de navegadores)
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Caché de navegadores de Playwright
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npx vite build
      - if: matrix.grep
        run: npm run e2e -- --grep "${{ matrix.grep }}"
      - if: matrix.shard
        run: npm run e2e -- --grep-invert "banco de fidelidad en " --shard=${{ matrix.shard }}
      - name: Capturas de B más M (solo paciente sintético)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mmode-${{ strategy.job-index }}
          path: test-results/**/mmode-*.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Guardar el informe si falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  # Agregador: falla si algún trabajo no terminó en verde (también si se canceló o se saltó); el resultado de `e2e` es
  # el de toda su matriz (verde solo si lo están todos los fragmentos)
  check:
    name: check
    needs: [verificar, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Todos los trabajos en verde
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTS"
          for r in $RESULTS; do [ "$r" = "success" ] || exit 1; done
