# Integración continua: lo mismo que `npm run check` en local (formato, lint, tipos, todas las pruebas
# con umbrales de cobertura, build y presupuesto de bundle), más la auditoría de dependencias de
# producción, el índice de decisiones y la e2e. Ningún paso se salta en CI; si algo es lento aquí, es
# lento también en local. El trabajo `check` agrega `verificar` y `e2e` (práctica de EchoTwin): es el
# único que exige la protección de `main`, así que renombrar o añadir un trabajo no la deja sin efecto.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: formato · lint · tipos · pruebas · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Pruebas (todos los niveles) con umbrales de cobertura
        run: npm run test:coverage
      - run: npm run build
      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev --audit-level=high
      - name: Índice de decisiones al día
        run: npx tsx tools/docs/decisions-index.ts --check

  # En paralelo con `verificar`: el tiempo total de CI es el del más lento
  e2e:
    name: extremo a extremo (Chromium + SwiftShader) ${{ matrix.shard }}/9
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8, 9]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Versión de Playwright (clave de la caché de navegadores)
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Caché de navegadores de Playwright
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npx vite build
      - run: npm run e2e -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - name: Guardar el informe si falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  # Agregador: falla si algún trabajo no terminó en verde (también si se canceló o se saltó)
  check:
    name: check
    needs: [verificar, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Todos los trabajos en verde
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTS"
          for r in $RESULTS; do [ "$r" = "success" ] || exit 1; done
