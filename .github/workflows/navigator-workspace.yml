# Transporte temporal del PR32. No modifica ramas: devuelve objetos Git para revisión por el conector.
# Se borra a sí mismo y a las tres partes del parche del árbol que prepara.
name: Navigator workspace
on:
  pull_request:
    paths: ['.github/workflows/navigator-workspace.yml']
permissions:
  contents: read
jobs:
  workspace:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/navegador-humano-procedural'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Verificar base y aplicar el parche exacto
        run: |
          test -z "$(git diff --name-only e6010f7a5a3a811b97e3f137bf5a3566c1fa90f7 HEAD -- . ':!.github/workflows/navigator-workspace.yml' ':!.navigator-patch-*')"
          cat .navigator-patch-1.b64 .navigator-patch-2.b64 .navigator-patch-3.b64 | base64 --decode | gzip -d > /tmp/navigator.patch
          echo '9f35af94d7ed5af6fec4014eb55c33362c0897bb608807036be99bcc5ef332be  /tmp/navigator.patch' | sha256sum -c -
          git apply --index --unidiff-zero /tmp/navigator.patch
          git rm .github/workflows/navigator-workspace.yml .navigator-patch-1.b64 .navigator-patch-2.b64 .navigator-patch-3.b64
      - name: Preparar objetos Git, sin commit ni cambio de rama
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          const repo = 'DanielOpazoD/lus-sim';
          if (process.env.GITHUB_REPOSITORY !== repo) throw new Error('Repositorio inesperado');
          const git = (...args) => execFileSync('git', args);
          const parent = git('rev-parse', 'HEAD').toString().trim();
          const base_tree = git('rev-parse', 'HEAD^{tree}').toString().trim();
          const paths = git('diff', '--cached', '--name-only', '-z').toString().split('\0').filter(Boolean);
          const deleted = new Set(git('diff', '--cached', '--name-only', '--diff-filter=D', '-z').toString().split('\0'));
          async function post(resource, body) {
            const response = await fetch(`https://api.github.com/repos/${repo}/git/${resource}`, {
              method: 'POST', headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' }, body: JSON.stringify(body),
            });
            if (!response.ok) throw new Error(`${resource}: ${response.status} ${await response.text()}`);
            return response.json();
          }
          const tree = [];
          for (const path of paths) {
            if (!/^(src\/|docs\/|e2e\/|README\.md$|\.github\/workflows\/navigator-workspace\.yml$|\.navigator-patch-[123]\.b64$)/.test(path)) throw new Error(`Ruta fuera del bloque: ${path}`);
            const sha = deleted.has(path) ? null : (await post('blobs', { encoding: 'base64', content: git('show', `:${path}`).toString('base64') })).sha;
            tree.push({ path, mode: '100644', type: 'blob', sha });
          }
          const result = await post('trees', { base_tree, tree });
          writeFileSync('/tmp/navigator-tree.json', JSON.stringify({ parent, tree_sha: result.sha, entries: tree }, null, 2));
          NODE
      - uses: actions/upload-artifact@v7
        with:
          name: navigator-tree
          path: /tmp/navigator-tree.json
          retention-days: 1
