# Actualizaciones semanales agrupadas (una PR por ecosistema): CI completo decide si entran.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    # @types/node sigue la versión mayor del runtime (.nvmrc): su mayor se sube a mano junto con .nvmrc
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    # Los grupos solo reúnen minor/patch: cada versión mayor llega en su propia PR (es una migración)
    groups:
      desarrollo:
        dependency-type: development
        update-types: [minor, patch]
      produccion:
        dependency-type: production
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      acciones:
        patterns: ['*']
